[package]
name = "myterminal"
version = "0.1.0"
edition = "2021"
description = "MyTerminal — Cross-platform terminal with embedded AI"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
sha2 = "0.10"
dirs = "5"
portable-pty = "0.8"

# LLM inference via llama.cpp bindings — runs GGUF models locally
llama-cpp-2 = "0.1.89"
encoding_rs = "0.8"

[features]
default = ["custom-protocol", "metal"]
custom-protocol = ["tauri/custom-protocol"]
metal = ["llama-cpp-2/metal"]     # macOS GPU acceleration
cuda = ["llama-cpp-2/cuda"]       # NVIDIA GPU acceleration
vulkan = []    # Cross-vendor GPU (AMD/Intel/NVIDIA)

[build-dependencies]
tauri-build = { version = "2", features = [] }
