name: Build All Platforms (macOS, Windows, Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos'
            os: 'macos-latest'
          - platform: 'windows'
            os: 'windows-latest'
          - platform: 'linux'
            os: 'ubuntu-22.04'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend & Tauri desktop application
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          CMAKE_OSX_DEPLOYMENT_TARGET: '11.0'
        run: npx tauri build

      - name: Package & collect installer bundles
        run: node scripts/build-package.js --skip-build

      - name: Upload platform build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTerminal-${{ matrix.platform }}-builds
          path: builds/${{ matrix.platform }}/*
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: builds/${{ matrix.platform }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
