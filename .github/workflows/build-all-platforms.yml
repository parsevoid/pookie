name: Build & Release All Platforms

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish to GitHub Releases'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        type: string
        default: 'v0.1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos'
            os: 'macos-latest'
          - platform: 'windows'
            os: 'windows-latest'
          - platform: 'linux'
            os: 'ubuntu-22.04'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend & Tauri desktop application
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          CMAKE_OSX_DEPLOYMENT_TARGET: '11.0'
        run: npx tauri build

      - name: Package & collect installer bundles
        run: node scripts/build-package.js --skip-build

      - name: Upload platform build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTerminal-${{ matrix.platform }}-builds
          path: builds/${{ matrix.platform }}/*
          if-no-files-found: error

  publish-release:
    name: Publish to GitHub Releases
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: ls -la release-artifacts

      - name: Determine tag name
        id: vars
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag_name || 'v0.1.0' }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Pookie ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
